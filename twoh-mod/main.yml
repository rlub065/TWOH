name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Build
        run: gradle build --no-daemon

      - name: Pick the correct (reobfuscated) jar
        run: |
          mkdir -p dist
          echo "== all jars =="
          find build -name '*.jar' | sort
          pick() {
            for f in $(find build -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar'); do
              rm -f /tmp/TwohMod.class
              unzip -p "$f" com/twoh/TwohMod.class > /tmp/TwohMod.class 2>/dev/null || continue
              [ -s /tmp/TwohMod.class ] || continue
              echo "candidate: $f"
              cp "$f" dist/twoh-mod.jar
              return 0
            done
            return 1
          }
          if ! pick; then
            echo "reobf jar not found, running reobfJar"
            gradle reobfJar --no-daemon
            find build -name '*.jar' | sort
            pick || { echo "ERROR: no jar found"; exit 1; }
          fi
          if [ -f build/reobfJar/output.jar ]; then
            echo "using reobfJar/output.jar"
            cp build/reobfJar/output.jar dist/twoh-mod.jar
          fi
          ls -la dist/

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: twoh-mod
          path: dist/twoh-mod.jar
